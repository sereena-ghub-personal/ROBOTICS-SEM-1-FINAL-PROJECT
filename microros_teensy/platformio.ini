; PlatformIO configuration for micro-ROS on Teensy 4.x
; This configuration sets up micro-ROS communication over USB serial

[env:teensy41]
platform = teensy
board = teensy41
framework = arduino

; micro-ROS library
lib_deps =
    https://github.com/micro-ROS/micro_ros_platformio

; Build flags for micro-ROS
build_flags =
    -D MICRO_ROS_TRANSPORT_ARDUINO_SERIAL
    -D MICRO_ROS_AGENT_TIMEOUT_MS=1000

; Board-specific settings
board_build.f_cpu = 600000000L
upload_protocol = teensy-cli
monitor_speed = 115200

; For Teensy 4.0, use this instead:
; [env:teensy40]
; platform = teensy
; board = teensy40
; framework = arduino
; lib_deps =
;     https://github.com/micro-ROS/micro_ros_platformio
; build_flags =
